name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.9.5
          sha256: 2d3c99a10e9729556ebf8ccdcd0298ce9566eebf3f197b598f0f9a2f88cdbe4b
          install: true
          cache: true
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: mise run setup
      - name: Check
        run: mise run check
