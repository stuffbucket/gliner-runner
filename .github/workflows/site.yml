name: Site

# Builds the documentation site (site/) and deploys it to GitHub Pages.
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - site/**
      - docs/**
      - benchmark-results/**
      - release/**
      - packages/onnx-runner/src/**
      - packages/onnx-runner/package.json
      - packages/onnx-runner/templates/**
      - packages/onnx-runner-web/**
      - src/gliner_runner/model_inventory.py
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.5
          sha256: 32f644d8c291bb182f702c6d2b0dda9f8b01441e940d74d328aad5f08446b2fd
          install: true
          cache: true
      - name: Install site dependencies
        run: mise exec -- pnpm install --frozen-lockfile --filter @gliner-runner/site...
      - name: Build site
        run: mise run site:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
