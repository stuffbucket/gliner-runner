name: Release build

# Reusable: builds every release asset from `ref` and uploads them as the `release-assets` workflow
# artifact. Callers publish. No models are downloaded or run anywhere in this workflow.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to build
        required: true
        type: string
      version:
        description: Release version, X.Y.Z or X.Y.Z-rc.N
        required: true
        type: string
      channel:
        description: stable or rc
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive:
    name: ONNX archive (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin-arm64 is the platform with parity evidence; the Linux archives are smoke-tested only.
          - platform: darwin-arm64
            runner: macos-15
            mise-sha256: 6274b68122a837c514374e96dabb18a9e3562bdd28528b4b3feea9d8eb615d98
          - platform: linux-x64
            runner: ubuntu-24.04
            mise-sha256: 32f644d8c291bb182f702c6d2b0dda9f8b01441e940d74d328aad5f08446b2fd
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            mise-sha256: 3721d44253d0a014545eb1fe13258333da270b98d8c7523e07e7619e74e2f77f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GLINER_RUNNER_RELEASE_VERSION: ${{ inputs.version }}
      # Never fetch the optional GPU libraries; the CPU runtime ships inside onnxruntime-node.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.5
          sha256: ${{ matrix.mise-sha256 }}
          install: true
          cache: true
      - name: Stamp release candidate version (build workspace only)
        if: inputs.channel == 'rc'
        run: mise run release:stamp
      - name: Install build dependencies
        run: mise run setup
      - name: Verify ONNX evaluation receipt
        run: mise run check:onnx-receipt
      - name: Package and smoke-verify ONNX runner (no models)
        run: mise run release:onnx-archive
      - name: Upload platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onnx-${{ matrix.platform }}
          path: |
            dist/onnx-runtime-build/gliner-runner-onnx-*.tar.gz
            dist/onnx-runtime-build/gliner-runner-onnx-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release assets
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GLINER_RUNNER_RELEASE_VERSION: ${{ inputs.version }}
      GLINER_RUNNER_RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.5
          sha256: 32f644d8c291bb182f702c6d2b0dda9f8b01441e940d74d328aad5f08446b2fd
          install: true
          cache: true
      - name: Stamp release candidate version (build workspace only)
        if: inputs.channel == 'rc'
        run: mise run release:stamp
      - name: Install build dependencies
        run: mise run setup
      - name: Verify OpenAPI contract
        run: mise run check:openapi
      - name: Build wheel, sdist, and client tarball
        run: mise run release:packages
      - name: Download platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: onnx-*
          path: dist/onnx-archives
          merge-multiple: true
      - name: Render Homebrew formula from the archive digests
        run: |
          set -eu
          if [ "$GLINER_RUNNER_RELEASE_CHANNEL" = rc ]; then formula=gliner-runner-rc.rb; else formula=gliner-runner.rb; fi
          mkdir -p dist/homebrew
          cat dist/onnx-archives/gliner-runner-onnx-*.tar.gz.sha256 > dist/homebrew/archive-sums
          mise exec -- node scripts/render-homebrew-formula.mjs \
            --version "$GLINER_RUNNER_RELEASE_VERSION" --channel "$GLINER_RUNNER_RELEASE_CHANNEL" \
            --sums dist/homebrew/archive-sums --output "dist/homebrew/$formula"
          echo "FORMULA=dist/homebrew/$formula" >> "$GITHUB_ENV"
      - name: Assemble release assets
        run: |
          set -eu
          test "$(find dist/onnx-archives -name 'gliner-runner-onnx-*.tar.gz' | wc -l)" -eq 3 || {
            echo 'Expected darwin-arm64, linux-x64, and linux-arm64 archives.' >&2
            exit 1
          }
          set -- --output-dir dist/release --onnx-runtime-dir dist/onnx-archives \
            --version "$GLINER_RUNNER_RELEASE_VERSION" --channel "$GLINER_RUNNER_RELEASE_CHANNEL" \
            --repository "$GITHUB_REPOSITORY" --homebrew-formula "$FORMULA"
          if [ -f install.sh ]; then
            set -- "$@" --installer install.sh
          else
            echo '::warning::install.sh not found at the repository root; release will not include it.'
          fi
          mise exec -- python scripts/assemble_release.py "$@"
          ls -l dist/release
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
