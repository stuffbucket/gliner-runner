name: Opt-in model validation

on:
  workflow_dispatch:
    inputs:
      task:
        description: Validation task to run
        required: true
        type: choice
        options:
          - integration
          - benchmark

permissions:
  contents: read

concurrency:
  group: opt-in-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ inputs.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.5
          sha256: 32f644d8c291bb182f702c6d2b0dda9f8b01441e940d74d328aad5f08446b2fd
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Run selected opt-in task
        env:
          TASK: ${{ inputs.task }}
        run: mise run "$TASK"
