name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  approve:
    name: Approve release asset build
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    # Configure the `release` environment with required reviewers: nothing from the tagged source
    # is built, and nothing gets write permission, until a reviewer approves.
    environment: release
    steps:
      - run: echo "Building ${{ needs.release-please.outputs.tag-name }}"

  build:
    name: Build release assets
    needs: [release-please, approve]
    uses: ./.github/workflows/_release-build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.release-please.outputs.tag-name }}
      version: ${{ needs.release-please.outputs.version }}
      channel: stable

  publish:
    name: Attach assets to GitHub release
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Attach assets (including latest.json) to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "$TAG_NAME" dist/release/* --clobber

  notify-tap:
    name: Notify Homebrew tap
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The tap's sync-gliner-runner workflow also runs on a schedule, so this only shortens the wait.
      - name: Send repository_dispatch to the tap (when HOMEBREW_TAP_TOKEN exists)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; the tap picks up $TAG_NAME on its next scheduled sync."
            exit 0
          fi
          gh api repos/stuffbucket/homebrew-tap/dispatches \
            -f event_type=gliner-runner-release \
            -f "client_payload[tag]=$TAG_NAME" \
            -f "client_payload[channel]=stable"

  brew-smoke:
    name: Homebrew install smoke test
    needs: [release-please, notify-tap]
    uses: ./.github/workflows/brew-smoke.yml
    permissions:
      contents: read
    with:
      channel: stable
      version: ${{ needs.release-please.outputs.version }}
