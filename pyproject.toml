[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gliner-runner"
version = "0.1.0"
description = "Backend-neutral, local GLiNER inference runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "stuffbucket" }]
keywords = ["gliner", "nlp", "inference", "local-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "aiofiles>=24.1.0,<25",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "huggingface-hub>=0.28.0,<2",
  "platformdirs>=4.3.0,<5",
  "psutil>=6.1.0,<8",
  "pydantic>=2.10.0,<3",
  "typer>=0.15.0,<1",
  "typing-extensions>=4.12.0,<5",
  "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
pytorch = [
  "gliner2[local]==2.0.0",
]
benchmark = [
]
dev = [
  "mutmut>=3.3.1,<4",
  "mypy>=1.14.0,<2",
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.9.0,<1",
  "types-aiofiles>=24.1.0,<25",
]

[project.scripts]
gliner-runner = "gliner_runner.cli:app"

[project.urls]
Homepage = "https://github.com/stuffbucket/gliner-runner"
Repository = "https://github.com/stuffbucket/gliner-runner"
Issues = "https://github.com/stuffbucket/gliner-runner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gliner_runner"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gliner_runner"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
  "src/gliner_runner/contracts.py",
  "src/gliner_runner/backends/pytorch.py",
  "src/gliner_runner/scheduler.py",
  "src/gliner_runner/runtime.py",
]
pytest_add_cli_args = ["-q", "-m", "not integration and not benchmark"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly configured real model",
  "benchmark: performance benchmark, excluded from normal tests",
]
