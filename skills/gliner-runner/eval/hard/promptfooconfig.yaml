# Hard tier of the gliner-runner skill eval: the answer must be a working script. hard/run.cjs runs it in a
# sandbox against a real runner and scores what it prints. See ../RESULTS.md.
description: gliner-runner skill A/B, hard tier

prompts:
  - id: file://prompts.cjs:noSkill
    label: A-no-skill
  - id: file://prompts.cjs:withSkill
    label: B-skill

providers:
  - id: openai:chat:claude-haiku-5-5-20260301
    label: haiku
    config: &answer
      apiBaseUrl: http://localhost:4141/v1
      apiKey: local
      temperature: 0
      max_tokens: 8000
  - id: openai:chat:claude-sonnet-5
    label: sonnet
    config: *answer

# Same grader as the easy tier. The hard tier has no llm-rubric asserts, so it is not called.
defaultTest:
  options:
    provider:
      id: openai:chat:claude-opus-5
      config:
        apiBaseUrl: http://localhost:4141/v1
        apiKey: local
        temperature: 0
        max_tokens: 2000

tests: file://tasks.yaml

evaluateOptions:
  maxConcurrency: 8
